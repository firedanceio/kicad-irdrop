[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-irdrop"
version = "0.1.0"
description = "DC IR-drop of power nets on a KiCad board's real copper: pours, tracks, pads and via barrels."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Firedance" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "shapely>=2.0"]
optional-dependencies = { maps = ["Pillow>=9"], test = ["pytest>=7"] }
keywords = ["kicad", "pcb", "power integrity", "ir drop", "pdn"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/firedanceio/kicad-irdrop"

[project.scripts]
kicad-irdrop = "kicad_irdrop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
